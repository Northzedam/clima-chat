name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Generar APK de depuración
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar componentes Android
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: clima-chat-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Mostrar resultado
        run: |
          echo "## ✅ Clima Chat compilado" >> "$GITHUB_STEP_SUMMARY"
          echo "El APK está disponible en el artifact **clima-chat-debug-apk** de esta ejecución." >> "$GITHUB_STEP_SUMMARY"
